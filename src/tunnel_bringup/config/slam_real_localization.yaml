# slam_real_localization.yaml — 운영 모드: 저장 지도로 위치추정만 (R6~R7)
# =====================================================================
# [mapping 과 무엇이 다른가]
#   mapping      : 빈 지도에서 시작해 벽을 그려가며 내 위치도 추정 (지도 제작 = R5)
#   localization : 완성된 posegraph 를 읽고 "이 지도 위에서 내가 어디?"만 추정 (운영)
#
# [왜 운영은 localization 인가 — 시뮬에서 이미 채택한 정책 그대로]
#   ① 실행마다 지도 품질이 달라지는 비결정성 제거 → 회귀·재현성
#   ② 시작 순간부터 완성 지도 기준이라 '지도가 자라며 생기는' 문제군이 사라짐
#   ③ 실제 시나리오와 동일: "터널 지도는 미리 있고, 재난 시 그 위에서 주행"
#
# [실행 노드] localization_slam_toolbox_node  (mapping 은 async_slam_toolbox_node)
#
# 스캔매칭 튜닝은 slam_real_mapping.yaml 과 같은 값이다 — localization 도 같은 매처로
# "지도 vs 현재 스캔"을 맞추므로 복도 대책이 그대로 필요하다. 근거 주석은 그 파일 참조.
slam_toolbox:
  ros__parameters:

    # ★ 실차 = 실제 시계.
    use_sim_time: false

    # --- 솔버 ---
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # --- 프레임/토픽 ---
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan

    # ===== localization 모드 핵심 =====
    mode: localization

    # ★ 읽을 posegraph 경로 — **여기에 절대경로를 쓰지 않는다.**
    #   시뮬 파일들은 노트북 계정(minwoo)의 홈 절대경로를 박아 뒀는데, Jetson 계정은
    #   hanhan 이라 그 경로가 아예 없어 확정적으로 실패한다 (MASTER_PLAN.md §7 예약 8).
    #   → 런치가 `map_file:=` 인자로 받아 이 값을 덮어쓴다.
    #     빈 문자열인 채로 뜨면 slam_toolbox 가 지도를 못 읽고 곧바로 실패한다
    #     (= fail-closed. 지도 없이 조용히 주행을 시작하는 것보다 낫다).
    map_file_name: ""

    # 시작 위치 = 지도 좌표계에서 로봇이 지금 서 있는 곳.
    # [0,0,0] 은 "출발 지점이 곧 지도 원점"이라는 뜻이고, 그건 R5 에서 지도를 만들 때
    # 출발한 자리와 물리적으로 같은 지점에서 기동한다는 전제다.
    # ⚠ 이 전제가 깨지면 로봇은 처음부터 엉뚱한 곳에 있다고 믿는다.
    # TODO: R5 후 확정 — 바닥 마킹 등 '시작 pose 재현 절차'를 세운다. 마킹 지점이
    #   지도 원점과 다르면 그 지점의 지도 좌표를 재서 여기 [x, y, yaw] 를 고친다
    #   (런치 인자로 빼지 않는다 — 지도 자산과 한 세트인 값이라 파일에 남아야 추적된다).
    map_start_pose: [0.0, 0.0, 0.0]

    # --- 지도 해상도/범위 ---
    resolution: 0.05
    max_laser_range: 12.0        # RPLIDAR C1 데이터시트 — TODO: R3 확인
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    map_update_interval: 2.0

    # --- 스캔 등록 조건 ---
    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.3

    # --- 스캔 매칭 (slam_real_mapping.yaml 과 동일) ---
    distance_variance_penalty: 0.1
    minimum_distance_penalty: 0.1
    correlation_search_space_dimension: 0.3
    angle_variance_penalty: 0.05
    minimum_angle_penalty: 0.1
    coarse_search_angle_offset: 0.1

    use_scan_matching: true
    use_scan_barycenter: true
    scan_buffer_size: 10
    link_match_minimum_response_fine: 0.1
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
