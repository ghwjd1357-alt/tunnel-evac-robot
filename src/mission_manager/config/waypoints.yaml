# waypoints.yaml — 임무 목표 좌표 모음 (코드 밖으로 분리)
# ============================================================
# 왜 코드가 아니라 yaml 인가:
#   "어디로 갈지"는 지도가 바뀌면(실차 터널로 교체 등) 반드시 바뀌는 값.
#   코드에 박으면 지도 바뀔 때마다 코드를 뜯어야 함 → yaml 숫자만 교체하도록 분리.
#
# 좌표계: map 프레임 (Nav2 goal 은 map 기준).
# ⚠ 아래 값은 T자 터널 시뮬 임시값. 실제 좌표는 아래로 먼저 확인 후 조정:
#     ros2 run tf2_ros tf2_echo map base_footprint   (로봇을 그 위치에 두고 읽기)
#   또는 이전 검증 goal(분기입구≈x12,y0 / 곁복도끝 / 동쪽끝) 참고.
# yaw = 라디안 (0=+x동쪽, 1.57=+y북쪽, 3.14=서쪽, -1.57=남쪽)

# --- 순찰 순회 지점 (PATROL 상태에서 이 리스트를 무한 루프) ---
#   ★ 07-19 전체 커버리지로 확장: 순찰의 목적 = 터널 '모든' 구간을 훑는 것.
#   기존(서쪽 3~10 왕복)은 곁복도·동쪽 절반이 감시 사각지대였음.
#   T자 지형(map): 메인복도 x -3~27(y=0) / 곁복도 x=12(y 3~13.5, 끝에 대피자 모형 y=13)
#   경로 = 서쪽 → 분기 → 곁복도 끝(왕복) → 동쪽 끝 → 서쪽 복귀 루프.
patrol:
  - {x: 3.0,  y: 0.0,  yaw: 0.0}     # 서쪽 구간 동진
  - {x: 12.0, y: 0.0,  yaw: 1.57}    # 분기 입구 (북향 준비)
  - {x: 12.0, y: 11.0, yaw: -1.57}   # 곁복도 끝 (모형 y=13 앞 2m 여유, 남향 회차)
  - {x: 12.0, y: 0.0,  yaw: 0.0}     # 분기 복귀 (동향 준비)
  - {x: 24.0, y: 0.0,  yaw: 3.14}    # 동쪽 끝 (동쪽벽 x=27 앞 3m, 서향 회차)
  - {x: 3.0,  y: 0.0,  yaw: 3.14}    # 서쪽 복귀 → 다시 처음으로

# --- 집결지 (APPROACH: 화재 감지 시 여기로) ---
#   ★ 07-06 부터 '계산'으로 전환: 집결지 = 화재→탈출구 방향선 위, 화재에서
#     gather_dist 만큼 떨어진 점 (compute_gather_point — 화재에 가깝되 안전한 곳).
#     아래 gather 고정값은 계산 불가(화재=탈출구) 시의 예비값(fallback)으로만 사용.
#   참고: gather_dist 8.0 + 표준 테스트 화재(14,0) → 집결지 (6,0) = 기존 검증값과 동일.
gather_dist: 8.0                       # 화재로부터의 집결 안전거리(m). search_back.min_fire_dist(5.0)보다 크게
gather: {x: 6.0, y: 0.0, yaw: 3.14}    # 예비값 (계산 불가 시)

# --- 복도 그래프 (07-19 신설 — 곁복도 화재 대응) ---
#   집결지 계산이 '직선'이면 곁복도 화재 때 벽을 뚫는 지점이 나와 Nav2 거부→FAULT.
#   → 복도 중심선을 그래프(노드+간선)로 선언, 집결지 = "화재→탈출구 그래프 최단
#     경로를 따라 gather_dist 만큼 걸어간 지점" (항상 복도 중심선 위 = 항상 도달 가능).
#   이 키가 없으면 기존 직선 수식으로 동작 (하위 호환).
# ★ S1-1 (07-19): 알람(화재 클릭)이 복도 중심선에서 이보다 멀면 '지도 밖 오클릭'으로
#   거부 (NaN/1km 오입력이 멀쩡한 집결지로 둔갑하던 구멍의 방어선. 복도 반폭 3m + 여유)
alarm_max_projection_dist: 5.0

corridor_graph:
  nodes:
    west:   {x: 0.0,  y: 0.0}    # 서쪽 입구(탈출구)
    junc:   {x: 12.0, y: 0.0}    # T자 분기점
    east:   {x: 26.0, y: 0.0}    # 동쪽 끝
    branch: {x: 12.0, y: 13.0}   # 곁복도 끝
  edges:
    - [west, junc]
    - [junc, east]
    - [junc, branch]

# --- 탈출구/안전구역 (유도 도착점) ---
escape: {x: 0.0, y: 0.0, yaw: 3.14}   # 서쪽 입구(안전구역 가정)

# --- 타이밍/속도 ---
gather_wait_sec: 8.0   # 집결지에서 싸이렌 켜고 사람 모으는 대기시간(초). 시간기반 집결.
guide_speed: 0.12      # GUIDE 유도 시 순항속도(m/s) — 사람 걸음 배려 저속
normal_speed: 0.26     # 평시 순항속도(m/s) — nav2_params 의 desired_linear_vel 과 일치

# --- SEARCH_BACK (③단계: 놓침 → 역행 재탐색) ---
search_back:
  cone_half_deg: 60.0    # 후방 감시 부채꼴 반각(도)
  detect_range: 2.5      # 이 거리(m) 안의 후방 점만 '추종자' (폭6m 터널 중앙에서 벽 배제 문턱)
  # 🆕 08-22 — 놓침 뒤 **제자리에서** 다시 찾아보는 시간 [s]. 이 시간을 넘겨야
  #   비싼 역행(180° 약 22초)으로 넘어간다. 선택 키 — 없으면 4.0.
  # 🆕 08-22 예약 61 — 역행 중 카메라 병행 재발견. 🔴 **기본 꺼짐**이다.
  #   라이다를 대체하지 않고 OR 로만 더한다. 카메라의 3~4 m·저조도 검출은
  #   아직 미검증이라(역할 B 08-18 G5 표) 켜기 전에 실측이 필요하다.
  camera_refind: false
  hold_sec: 4.0
  lost_sec: 3.0          # 이만큼 연속 미검출 → 놓침 확정 (디바운스 — 무한왕복 방지)
  seen_sec: 1.0          # 이만큼 연속 검출 → 재발견 확정
  cluster_max_width: 0.8 # 점뭉치 폭 상한(m) — 이보다 넓은 덩어리는 벽으로 배제 (07-06 클러스터 판별)
  # ↓ 라이다 물리 특성(각해상도·노이즈)에 묶인 값 3개 — 실물 RPLIDAR C1 전환 시 1순위 재튜닝 (07-07 노출)
  min_points: 3          # 덩어리 최소 점 수 — 미만이면 노이즈로 무시 (실물은 노이즈 많아 ↑ 후보)
  range_jump: 0.3        # 이웃 빔 거리차(m) — 이보다 크면 다른 물체로 분리
  edge_margin: 0.2       # 검출 문턱(detect_range) 경계의 슬라이버 배제 폭(m)
  scan_timeout: 1.0      # ★ watchdog(07-19): /scan 이 이 시간(초) 넘게 끊기면 visible/lost 판정 보류
                         #   (라이다 사망 = '추종 양호' 오독 방지. 실물 라이다 주기에 맞춰 재튜닝 후보)
  max_attempts: 2        # ★ 안전장치①: 역행 최대 횟수 — 초과 시 보고 후 단독 탈출
  min_fire_dist: 5.0     # ★ 안전장치②: 역행 목표는 화재에서 최소 이 거리(m) — 불속 재진입 금지
  refind_wait_sec: 10.0  # 역행 지점 도착 후 재탐색 대기(초) — 지나면 이번 시도 실패

# --- 🆕 08-22 사람 판정 게이트 (`PROJECT_CONTEXT §4.1-b`) ---------------------
# 🔴 **기본은 꺼짐이다.** 본편 테이크는 `camera:=false` 라 어댑터가 아예 없고,
#   그러면 `/person_status` 가 한 건도 안 온다. 게이트를 켜 두면 그 상태가 'stale'
#   로 굳어 **사람이 멀쩡히 서 있는데도 RESCUE 로 빠진다.**
#   → 카메라·어댑터를 같이 띄우는 통합 테이크에서만 true 로 올린다.
person_gate: false
# 판정이 안 서는 채로 이만큼 더 기다리면 신고(RESCUE)로 간다.
# 🔴 모르면 신고다 — 판정 불가를 '괜찮다'로 접으면 쓰러진 사람을 두고 나간다.
person_decide_timeout_sec: 10.0
# 미션 **자신의** 신선도 가드. 어댑터가 죽으면 아무 말도 못 하므로 마지막 값을
# 그대로 믿으면 안 된다. 어댑터는 10 Hz 로 쏜다 — 1초면 충분히 관대하다.
person_status_timeout_sec: 1.0
# 제자리 훑기 — `person_gate: true` 일 때만 돈다.
# 🔴 스텝을 늘리면 그림은 부드럽지만 goal 왕복이 늘어 시간이 길어진다.
#   4 × 90° 가 대본의 집결 장면(40~60초) 안에 들어간다.
scan_steps: 4
# 각 스텝 도착 뒤 서서 판정 프레임을 모으는 시간. 어댑터 10 Hz × 2초 = 20 프레임이라
# `person_min_frames`(6) 를 넉넉히 넘는다.
scan_dwell_sec: 2.0
