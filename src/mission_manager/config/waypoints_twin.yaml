# waypoints_twin.yaml — 쌍굴(twin-bore) 터널 미션 좌표 (07-07)
# ============================================================
# T자 정본(waypoints.yaml)과 같은 스키마 — 좌표만 쌍굴 지도 기준.
# 좌표계: map 프레임. 스폰 = world(-17,0) = map(0,0) → map = world + (17, 0)
#
#   [쌍굴 지형 치트시트 — map 좌표]
#   1번 굴 중심선 y=0  (x: -3 ~ 37, 서쪽벽 -3 / 동쪽벽 37)
#   2번 굴 중심선 y=10
#   피난연결통로 3개: x = 7, 17, 27 (폭 2.5m, y 3~7 구간)
#   장애물: 배럴 map(25, -1.5), 콘 map(22, -2.2) / 대피자 모형 map(20, 11.8)
#
# yaw = 라디안 (0=+x동쪽, 1.57=+y북쪽, 3.14=서쪽, -1.57=남쪽)

# --- 순찰 순회 지점: 두 굴을 피난통로로 8자처럼 도는 루프 ---
#     1번 굴 동진 → 동쪽 통로(x=27)로 2번 굴 → 2번 굴 서진 → 서쪽 통로(x=7)로 복귀
patrol:
  - {x: 5.0,  y: 0.0,  yaw: 0.0}     # 1번 굴 서쪽 구간
  - {x: 27.0, y: 0.0,  yaw: 1.57}    # 동쪽 통로 입구 (북향 준비)
  - {x: 27.0, y: 10.0, yaw: 3.14}    # 통로 통과 → 2번 굴 (서향 준비)
  - {x: 7.0,  y: 10.0, yaw: -1.57}   # 2번 굴 서쪽, 서쪽 통로 입구
  - {x: 7.0,  y: 0.0,  yaw: 3.14}    # 통로 통과 → 1번 굴 복귀

# --- 집결지: 07-06 부터 화재→탈출구 방향선 위 gather_dist 지점 '계산' ---
#     아래 gather 고정값은 계산 불가(화재=탈출구) 시 fallback.
#     표준 테스트 화재 map(30,0) + 탈출구 (0,0) → 계산 집결지 = (22, 0)
gather_dist: 8.0
gather: {x: 22.0, y: 0.0, yaw: 3.14}   # 예비값 (계산 불가 시)

# --- 복도 그래프 (07-19 신설 — T자와 동일 개념, 쌍굴 좌표) ---
#   2번 굴 화재 때 직선 수식이 굴 사이 벽을 뚫는 문제 방지: 집결지 = 그래프
#   최단 경로(피난통로 경유)를 따라 화재에서 gather_dist 걸어간 지점.
# ★ S1-1 (07-19): 알람이 복도 중심선에서 이보다 멀면 지도 밖 오클릭으로 거부
alarm_max_projection_dist: 5.0

corridor_graph:
  nodes:
    b1_w:  {x: 0.0,  y: 0.0}     # 1번 굴 서쪽(탈출구)
    b1_p1: {x: 7.0,  y: 0.0}     # 1번 굴 × 서쪽 통로
    b1_p2: {x: 17.0, y: 0.0}     # 1번 굴 × 가운데 통로
    b1_p3: {x: 27.0, y: 0.0}     # 1번 굴 × 동쪽 통로
    b1_e:  {x: 35.0, y: 0.0}     # 1번 굴 동쪽 끝
    b2_w:  {x: 0.0,  y: 10.0}    # 2번 굴 서쪽 끝
    b2_p1: {x: 7.0,  y: 10.0}    # 2번 굴 × 서쪽 통로
    b2_p2: {x: 17.0, y: 10.0}    # 2번 굴 × 가운데 통로
    b2_p3: {x: 27.0, y: 10.0}    # 2번 굴 × 동쪽 통로
    b2_e:  {x: 35.0, y: 10.0}    # 2번 굴 동쪽 끝
  edges:
    - [b1_w, b1_p1]
    - [b1_p1, b1_p2]
    - [b1_p2, b1_p3]
    - [b1_p3, b1_e]
    - [b2_w, b2_p1]
    - [b2_p1, b2_p2]
    - [b2_p2, b2_p3]
    - [b2_p3, b2_e]
    - [b1_p1, b2_p1]   # 피난통로 x=7
    - [b1_p2, b2_p2]   # 피난통로 x=17
    - [b1_p3, b2_p3]   # 피난통로 x=27

# --- 탈출구/안전구역: 1번 굴 서쪽 끝 = 스폰 지점 (map 원점) ---
escape: {x: 0.0, y: 0.0, yaw: 3.14}

# --- 타이밍/속도 (T자와 동일 — 로봇 특성이지 지형 특성이 아님) ---
gather_wait_sec: 8.0
guide_speed: 0.12
normal_speed: 0.26

# --- SEARCH_BACK (T자와 동일 — 라이다·디바운스 특성값) ---
#     detect_range 2.5 는 폭 2.5m 통로 안에선 벽이 범위에 들어오지만,
#     클러스터 폭 판별(cluster_max_width 0.8)이 벽 호를 배제하므로 유지.
search_back:
  cone_half_deg: 60.0
  detect_range: 2.5
  # 🆕 08-22 — 놓침 뒤 **제자리에서** 다시 찾아보는 시간 [s]. 이 시간을 넘겨야
  #   비싼 역행(180° 약 22초)으로 넘어간다. 선택 키 — 없으면 4.0.
  # 🆕 08-22 예약 61 — 역행 중 카메라 병행 재발견. 🔴 **기본 꺼짐**이다.
  #   라이다를 대체하지 않고 OR 로만 더한다. 카메라의 3~4 m·저조도 검출은
  #   아직 미검증이라(역할 B 08-18 G5 표) 켜기 전에 실측이 필요하다.
  camera_refind: false
  hold_sec: 4.0
  lost_sec: 3.0
  seen_sec: 1.0
  cluster_max_width: 0.8
  min_points: 3
  range_jump: 0.3
  edge_margin: 0.2
  scan_timeout: 1.0      # ★ watchdog(07-19): /scan 이 이 시간(초) 넘게 끊기면 visible/lost 판정 보류
  max_attempts: 2
  min_fire_dist: 5.0
  refind_wait_sec: 10.0

# --- 🆕 08-22 사람 판정 게이트 (`PROJECT_CONTEXT §4.1-b`) ---------------------
# 🔴 **기본은 꺼짐이다.** 본편 테이크는 `camera:=false` 라 어댑터가 아예 없고,
#   그러면 `/person_status` 가 한 건도 안 온다. 게이트를 켜 두면 그 상태가 'stale'
#   로 굳어 **사람이 멀쩡히 서 있는데도 RESCUE 로 빠진다.**
#   → 카메라·어댑터를 같이 띄우는 통합 테이크에서만 true 로 올린다.
person_gate: false
# 판정이 안 서는 채로 이만큼 더 기다리면 신고(RESCUE)로 간다.
# 🔴 모르면 신고다 — 판정 불가를 '괜찮다'로 접으면 쓰러진 사람을 두고 나간다.
person_decide_timeout_sec: 10.0
# 미션 **자신의** 신선도 가드. 어댑터가 죽으면 아무 말도 못 하므로 마지막 값을
# 그대로 믿으면 안 된다. 어댑터는 10 Hz 로 쏜다 — 1초면 충분히 관대하다.
person_status_timeout_sec: 1.0
# 제자리 훑기 — `person_gate: true` 일 때만 돈다.
# 🔴 스텝을 늘리면 그림은 부드럽지만 goal 왕복이 늘어 시간이 길어진다.
#   4 × 90° 가 대본의 집결 장면(40~60초) 안에 들어간다.
scan_steps: 4
# 각 스텝 도착 뒤 서서 판정 프레임을 모으는 시간. 어댑터 10 Hz × 2초 = 20 프레임이라
# `person_min_frames`(6) 를 넉넉히 넘는다.
scan_dwell_sec: 2.0
# 한 훑기 스텝의 벽시계 상한 [s]. 응답·결과가 영원히 안 오는 경우를 막는다.
# 넘으면 기존 FAULT 재시도 예산으로 간다. 90° 회전 약 11초 + 계획·여유.
scan_goal_timeout_sec: 90.0
