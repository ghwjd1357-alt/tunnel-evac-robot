# waypoints_real_H.yaml — 실터널 H자 좌표 (2026-08-21 신설 · 예약 53)
# =============================================================================
# 🔴 이 파일이 왜 따로 있는가
#   `waypoints.yaml` 은 **폭 6 m T자 시뮬 터널** 전제다(x 최대 24 m · 곁복도 y 13 m).
#   실터널은 **H자 · 복도 폭 2.35 m** 라 좌표도 판별 파라미터도 전부 다르다.
#   시뮬 회귀(pytest 184건)가 옛 파일을 쓰므로 **덮어쓰지 않고 새로 만든다.**
#
#   쓰는 법 — 미션 노드만 다시 띄우면 된다(SLAM·Nav2 는 살려 둔 채):
#     ros2 run mission_manager mission_node --ros-args \
#       -p waypoints_file:=/home/hanhan/ros2_ws/src/mission_manager/config/waypoints_real_H.yaml
#   런치로 줄 때: real_bringup.launch.py mission:=true waypoints_file:=<위 경로>
#
# =============================================================================
# 좌표계 = `corridor_0820` 지도의 map 프레임. 원점 = 08-20 밤 매핑 시작 지점.
# 실측 정본 = docs/REAL_ROBOT_VALUES.md §1-l-4(기하) · §1-l-5(6점)
#
#   구조물      닫힌 구간              길이     폭     중심선
#   위 복도     x −2.50 ~ +18.25      20.75 m  2.35 m  y = −0.08
#   아래 복도   x −0.75 ~ +18.50      19.25 m  2.35 m  y = −10.65
#   연결통로    y −9.50 ~ −1.25        8.25 m  1.60 m  x = +8.95
#
# 🔴 **밟은 범위는 x −0.19 ~ +12.99 뿐이다.** 벽은 x +18 까지 그려졌지만 그건
#    5 m 넘게 떨어져서 라이다로 본 것이라 신뢰도가 다르다.
#    **모든 좌표를 밟은 범위 안에 둔다.**
#
#          x=0        8.95              12.5
#    y=-0.08 ┌──────────┬─────────────────┐   위 복도
#            │ START    │           🔥화재1│
#            └──────────┼─────────────────┘
#                       │ 연결통로 7.3 m
#            ┌──────────┼─────────────────┐
#   y=-10.65 │ 🚪탈출  ←┴                 │   아래 복도
#            └──────────┴─────────────────┘
# =============================================================================

# --- 순찰 (PATROL 이 무한 루프) -----------------------------------------------
# 대본 ① = 위 복도 서쪽에서 출발해 동진. 화재 알람은 동쪽 끝 부근에서 받는다.
# 🔴 코너(분기점 x=8.95)에 waypoint 를 두지 않는다 — 예약 57.
#    로봇이 코너에서 서면 명령 부호가 1.45 Hz 로 뒤집혀 64초에 2.3 cm 만 돈다.
#    (실측 = REAL_ROBOT_VALUES §1-l-6. 우회 = 목표를 통로 안쪽/직선 구간에)
# 🔴🔴 이 파일은 **리허설 단축본**이다 (`waypoints_real_H.yaml` 이 정본).
#   순찰 구간을 짧게 잘라 알람까지 걸리는 시간을 줄인다. 리허설을 여러 번
#   돌릴 때만 쓴다. 🔴 **촬영에는 쓰지 않는다** — 대본 ①(순찰)이 안 나온다.
patrol:
  - {x: 10.50, y: -0.08, yaw:  0.00}   # 집결지 부근에서 짧게 왕복
  - {x: 11.50, y: -0.10, yaw:  3.14}

# --- 집결지 계산 --------------------------------------------------------------
# 집결지 = 화재에서 "화재→탈출구 그래프 경로"를 따라 gather_dist 만큼 걸어간 점.
# 🔴 gather_dist 를 8.0(시뮬값)으로 두면 집결지가 분기점을 지나 **연결통로
#    한가운데(폭 1.60 m)** 로 들어간다 — 사람을 세울 수도, 로봇이 돌 수도 없다.
#    화재 x=12.5 · 분기점 x=8.95 이므로 2.0 이면 집결지 x≈10.5 (분기점에서 1.5 m 여유).
gather_dist: 2.0
gather: {x: 10.50, y: -0.08, yaw: 3.14}   # 계산 불가 시 예비값 (사람이 검증한 좌표)

# 🔴 알람 신뢰경계 — 복도 중심선에서 이보다 멀면 '지도 밖 오클릭'으로 거부.
#    시뮬값 5.0 은 폭 6 m(반폭 3 m) + 여유 2 m 였다. 실복도는 반폭 1.18 m 이므로
#    같은 논리로 3.0. ⚠ 너무 조이면 카메라 어댑터가 낸 좌표가 매번 거부된다 —
#    어댑터는 depth 오차를 그대로 싣는다(예약 60).
alarm_max_projection_dist: 3.0

# --- 복도 그래프 (H자) --------------------------------------------------------
# 집결지 계산이 '직선'이면 벽을 뚫는 지점이 나와 Nav2 거부 → FAULT.
# 그래서 복도 중심선을 그래프로 선언하고 그 위를 걸어간다.
corridor_graph:
  nodes:
    up_west:  {x:  0.50, y:  -0.08}   # 위 복도 서쪽 (START 부근)
    up_junc:  {x:  8.95, y:  -0.08}   # 위 복도 ↔ 연결통로
    up_east:  {x: 12.99, y:  -0.10}   # 위 복도 동쪽 = 밟은 범위 끝
    low_junc: {x:  8.95, y: -10.65}   # 아래 복도 ↔ 연결통로
    low_east: {x: 12.45, y: -10.97}   # 아래 복도 동쪽 (실측 §1-l-5 #5)
    # 🔴 미측정 — 08-21 오전 M4 에서 tf2_echo 로 확정한다. 그때까지 잠정값이다.
    low_west: {x:  0.50, y: -10.65}
  edges:
    - [up_west,  up_junc]
    - [up_junc,  up_east]
    - [up_junc,  low_junc]     # 연결통로 (폭 1.60 m)
    - [low_junc, low_west]
    - [low_junc, low_east]

# --- 탈출구 -------------------------------------------------------------------
# 🔴 **아래 복도 서쪽**이다. 08-20 회의에서 동쪽으로 잡았다가 08-21 에 바꿨다.
#   이유 = `SEARCH_BACK` 의 역행 목표 yaw 가 코드에 **0.0 으로 하드코딩**돼 있어
#   (mission_node.enter_search_back), 유도 방향이 **서쪽일 때만** 180° 턴이 난다.
#   동쪽으로 유도하면 목표 yaw 와 현재 yaw 가 같아 **회전이 0** 이다.
#   → 대본의 하이라이트(180° 돌아 사람 확인)가 아예 안 나온다. 결함 = 예약 58.
# ⚠ low_west 가 미측정이므로 이 값도 08-21 오전에 같이 확정한다.
escape: {x: 0.50, y: -10.65, yaw: 3.14}

# --- 타이밍 / 속도 ------------------------------------------------------------
gather_wait_sec: 12.0   # 집결 대기. 시뮬 8초 → 사이렌·집결 장면을 보여줄 시간으로 늘림

# 🔴 두 값 다 **08-21 오전 M1(선형 불감대) 전까지 잠정값**이다.
#   구동부 명령 상한이 0.12 m/s 인데 시뮬은 normal 0.26 을 쓴다 — 2.17배다(예약 50).
#   그리고 **선형 불감대를 한 번도 잰 적이 없다.** guide_speed 가 불감대보다
#   낮으면 로봇이 아예 안 움직이고, 미션은 그 자리에서 멈춘다(FAULT 도 아니다).
guide_speed: 0.10      # 유도 저속
normal_speed: 0.10     # 평시. 🔴 실차 상한 0.12 이내

# --- SEARCH_BACK (놓침 → 역행 재탐색) -----------------------------------------
# 🔴 이 로봇의 사람 추종은 **카메라가 아니라 라이다**다. 아래 값이 그 판별기다.
search_back:
  cone_half_deg: 60.0
  # 🔴 08-21 오전 M3(사람 세워 실측) 전까지 잠정값 2개.
  #   아래 복도 폭 2.35 m → 반폭 1.18 m. detect_range 가 반폭보다 크면 벽이
  #   검출 범위에 들어오고, 그 벽 조각이 cluster_max_width 밑으로 잘리면
  #   **사람으로 오인**된다. 1.5 는 "사람은 잡고 벽은 되도록 배제" 의 절충이다.
  detect_range: 1.5
  cluster_max_width: 0.8
  # 🆕 08-22 — 놓침 뒤 **제자리에서** 다시 찾아보는 시간 [s]. 이 시간을 넘겨야
  #   비싼 역행(180° 약 22초)으로 넘어간다. 선택 키 — 없으면 4.0.
  hold_sec: 4.0
  lost_sec: 3.0
  seen_sec: 1.0
  min_points: 3
  range_jump: 0.3
  edge_margin: 0.2
  scan_timeout: 1.0
  max_attempts: 2
  # 🔴 gather_dist(2.0) 보다 작아야 한다 — 크면 집결지 자체가 화재 배제구역
  #   안에 들어가 역행 목표 클램프가 깨진다.
  #   ⚠ 확정 대본에서는 SEARCH_BACK 이 화재로부터 10 m 넘게 떨어진 아래 복도에서
  #     일어나므로 이 클램프는 발동하지 않는다. 불변조건 유지용 값이다.
  min_fire_dist: 1.5
  refind_wait_sec: 10.0

# --- 🆕 08-22 사람 판정 게이트 (`PROJECT_CONTEXT §4.1-b`) ---------------------
# 🔴 **기본은 꺼짐이다.** 본편 테이크는 `camera:=false` 라 어댑터가 아예 없고,
#   그러면 `/person_status` 가 한 건도 안 온다. 게이트를 켜 두면 그 상태가 'stale'
#   로 굳어 **사람이 멀쩡히 서 있는데도 RESCUE 로 빠진다.**
#   → 카메라·어댑터를 같이 띄우는 통합 테이크에서만 true 로 올린다.
person_gate: false
# 판정이 안 서는 채로 이만큼 더 기다리면 신고(RESCUE)로 간다.
# 🔴 모르면 신고다 — 판정 불가를 '괜찮다'로 접으면 쓰러진 사람을 두고 나간다.
person_decide_timeout_sec: 10.0
# 미션 **자신의** 신선도 가드. 어댑터가 죽으면 아무 말도 못 하므로 마지막 값을
# 그대로 믿으면 안 된다. 어댑터는 10 Hz 로 쏜다 — 1초면 충분히 관대하다.
person_status_timeout_sec: 1.0
